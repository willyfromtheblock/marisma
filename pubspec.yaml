name: dart_utxo_server
description: Bitcoin-like RPC data feeder for Cloudflare KV.
publish_to: none
version: 1.0.0
homepage: https://github.com/willyfromtheblock/dart-address-kv-feeder

environment:
  sdk: '>=2.17.6 <3.0.0'

dependencies: 
  coinslib: ^3.1.4
  dart_coin_rpc: ^2.1.4
  hex: ^0.2.0
  logger: ^1.1.0
  shelf: ^1.4.0
  shelf_web_socket: ^1.0.2
  surrealdb: ^0.4.6

dev_dependencies:
  lints: ^2.0.0
  test: ^1.16.0
  build_runner: ^2.0.4