syntax = "proto3";
package marisma;

service Marisma {
  rpc GetBlockHeight (BlockHeightRequest) returns (BlockHeightReply) {}
  rpc GetAdressBalance (AddressBalanceRequest) returns (AddressBalanceReply) {}
  rpc GetAddressUtxos (AddressUtxosRequest) returns (AddressUtxosReply) {}
}

message BlockHeightRequest {
}

message BlockHeightReply {
  int32 height = 1;
}

message AddressBalanceRequest {
  string address = 1;
}

message AddressBalanceReply {
  double balance = 1;
  int32 balance_sats = 2;
}

message AddressUtxosRequest {
  string address = 1;
}

message AddressUtxosReply {
 string utxos = 1;
}
