syntax = "proto3";
package marisma;

service MarismaServer {
  rpc GetBlockHeight (BlockHeightRequest) returns (BlockHeightReply) {}
  rpc GetAdressBalance (AddressBalanceRequest) returns (AddressBalanceReply) {}
}

message BlockHeightRequest {
}

message BlockHeightReply {
  int32 height = 1;
}

message AddressBalanceRequest {
  string address = 1;
}

message AddressBalanceReply {
  double balance = 1;
}
