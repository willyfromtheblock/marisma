version: '3.1'
services:
  marisma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marisma
    env_file:
      - .env
    restart: always
    ports:
      - "50051:50051"
    logging:
      driver: "json-file"
      options:
        max-size: 100m
     depends_on:
      - surrealdb
  surrealdb:
    image: surrealdb/surrealdb:latest
    user: root
    restart: always
    command:
      - start
      - --user=root
      - --pass=root
      - --log=error
      - file:data/mydatabase.db
    volumes:
      - ./surrealdb:/data
    logging:
      driver: "json-file"
      options:
        max-size: 100m