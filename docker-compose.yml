version: '3.1'
services:
  marisma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marisma
    environment: 
      - COIN_NAME=""
      - COIN_RPC_HOST=""
      - COIN_RPC_PORT=""
      - COIN_RPC_USER=""
      - COIN_RPC_PASSWORD=""
      - COIN_RPC_USE_SSL="false"
      - LOG_LEVEL="info"
      - GRPC_PORT=50051
    restart: always
    stop_grace_period: 30m
    ports: 
      - "50051:50051"
    logging:
      driver: "json-file"
      options:
        max-size: 100m