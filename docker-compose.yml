version: '3.1'
services:
  dart_utxo_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dart_utxo_server
    environment: 
      - COIN_NAME=""
      - COIN_RPC_HOST=""
      - COIN_RPC_PORT=""
      - COIN_RPC_USER=""
      - COIN_RPC_PASSWORD=""
      - COIN_RPC_USE_SSL="false"
      - SURREAL_HOST="ws://localhost"
      - SURREAL_PORT="8005"
      - SURREAL_USER="root"
      - SURREAL_PASS="root"
      - LOG_LEVEL="info"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: 100m
    depends_on:
      - surrealdb

  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb
    restart: always
    ports:
      - "8005:8000"
    command:
      - start
      - --user=root 
      - --pass=root
      - file:data/surreal
    volumes:
      - surrealdb:/data
    logging:
      driver: "json-file"
      options:
        max-size: 100m  
volumes:
  surrealdb:
    external: true